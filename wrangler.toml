name = "youtubekit-server"
main = "src/index.ts"
compatibility_date = "2025-05-03"

# Dynamic Worker Loader binding (closed beta)
[[worker_loaders]]
binding = "LOADER"

# Limit CPU execution [in milliseconds]
[limits]
cpu_ms = 5000

[observability]
enabled = true

# [placement]
# mode = "smart"

# Variables will be loaded from .dev.vars for local development
[vars]
EVAL_ENGINE = "loader" # "quickjs" (default) or "loader"



# Production environment --------------------------------------------------------

[env.production]
name = "youtubekit-server-production"