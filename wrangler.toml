name = "youtubekit-server"
main = "src/index.ts"
compatibility_date = "2025-05-03"

# Limit CPU execution [in milliseconds]
[limits]
cpu_ms = 5000

[observability]
enabled = true

# [placement]
# mode = "smart"

# Variables will be loaded from .dev.vars for local development
[vars]
RATE_LIMIT_DAILY_REQUESTS = "5000"
RATE_LIMIT_WEEKLY_REQUESTS = "20000"
RATE_LIMIT_BUCKET_SECONDS = "300"

[[durable_objects.bindings]]
name = "APP_RATE_LIMITER"
class_name = "AppRateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "AppRateLimiter" ]



# Production environment --------------------------------------------------------

[env.production]
name = "youtubekit-server-production"
[env.production.vars]
RATE_LIMIT_DAILY_REQUESTS = "5000"
RATE_LIMIT_WEEKLY_REQUESTS = "20000"
RATE_LIMIT_BUCKET_SECONDS = "300"

[[env.production.durable_objects.bindings]]
name = "APP_RATE_LIMITER"
class_name = "AppRateLimiter"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = [ "AppRateLimiter" ]
